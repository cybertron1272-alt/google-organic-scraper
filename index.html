
<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<title>Google 1. strana – Organic výsledky</title>
</head>
<body>
  <h2>Google Organic Search – 1. strana</h2>
  <input id="kw" placeholder="Zadej klíčové spojení..." style="width:300px"/>
  <button onclick="search()">Hledat</button>

  <pre id="out"></pre>

  <button onclick="saveJSON()">Uložit JSON</button>
  <button onclick="saveCSV()">Uložit CSV</button>

<script>
let lastData = [];

async function search() {
  const q = document.getElementById("kw").value;
  const res = await fetch("/search?q=" + encodeURIComponent(q));
  const data = await res.json();
  lastData = data;
  document.getElementById("out").textContent = JSON.stringify(data, null, 2);
}

function saveJSON() {
  const blob = new Blob([JSON.stringify(lastData, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "google_results.json";
  a.click();
}

function saveCSV() {
  const header = ["position","title","link","snippet"];
  const csvRows = [
    header.join(","),
    ...lastData.map(r => [
      r.position,
      `"${String(r.title).replace(/"/g,'""')}"`,
      `"${String(r.link).replace(/"/g,'""')}"`,
      `"${String(r.snippet).replace(/"/g,'""')}"`
    ].join(","))
  ];

  const csvString = csvRows.join("\n");
  const bytes = new TextEncoder().encode(csvString);
  const blob = new Blob([bytes], { type: "text/csv;charset=utf-8" });

  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "google_results.csv";
  a.click();
}
</script>
</body>
</html>
